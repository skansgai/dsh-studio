distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 注意：distributionUrl 已临时改为腾讯云镜像。
# 原因：本机访问 services.gradle.org 实测约 45 KB/s，下载一个 Gradle 发行版要近一小时。
# 若你在海外或官方源速度正常，请改回：
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# （改回会触发一次重新下载，因为 wrapper 的缓存目录名由 URL 哈希决定。）
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.7.1-bin.zip
networkTimeout=120000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
