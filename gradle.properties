# ────────────────────────────────────────────────────────────────────────────
# DeepSeek Harness Studio — Gradle 配置
# ────────────────────────────────────────────────────────────────────────────
#
# IDE 构建目标（IntelliJ Gradle Plugin 1.x 的 intellij { } 块读取以下属性）：
#
#   dsh.ide.localPath — 直接使用本机已安装的 IDE（零下载，构建最快）。
#                       推荐设置为你本机的 Android Studio 路径，例如：
#                       dsh.ide.localPath=C\:/Program Files/Android/Android Studio
#                       构建脚本也会自动识别该默认路径（已安装时无需配置）。
#
#   dsh.ide.type / dsh.ide.version — 让 Gradle 下载对应 IDE 发行版用于构建。
#                       默认 IntelliJ Community（体积最小、下载最快），插件在
#                       Android Studio 中同样可安装运行。若要直接针对 Android
#                       Studio 构建，请改为：
#                       dsh.ide.type=android-studio
#                       dsh.ide.version=2024.2.1.12   # 改成你本机 AS 的版本号
dsh.ide.type=IC
dsh.ide.version=2024.2.3

# ── JetBrains Marketplace 发布（详见 PUBLISHING.md）─────────────────────────
# 以下值不要写进仓库！可通过三种方式提供（任选其一，命令行 -P 优先级最高）：
#   1) 命令行参数：gradlew signPlugin -PsignPlugin.privateKeyFile=... -PsignPlugin.certificateChainFile=... -PsignPlugin.password=...
#   2) 环境变量：ORG_GRADLE_PROJECT_signPlugin.privateKeyFile=...
#   3) 本地文件 signing.local.properties（已 gitignore）
# signPlugin.certificateChainFile=
# signPlugin.privateKeyFile=
# signPlugin.password=
# intellijPlatformPublishingToken=

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ── 内置 dsh 运行时（bundleDshRuntime，详见 docs/design-bundled-runtime.md）────
# 内置后首次启动秒开，不再需要 `npx` 现拉（约 284MB / 十几分钟）。
# 与插件版本解耦，可单独升级。
dsh.runtime.version=0.1.2-rc.1

# 目标平台。宿主平台会真正跑一次 npm install 并做启动自检；其余平台的原生包
# （sharp / ripgrep / koffi / node-pty prebuild）按 lockfile 里的 tarball 地址定点抓取。
# 只想快速验证时可临时覆盖，例如：-Pdsh.runtime.targets=win32-x64
# dsh.runtime.targets=win32-x64,darwin-x64,darwin-arm64,linux-x64,linux-arm64

# 图片处理库 sharp 的打包方式（体积差异很大，见 docs/design-bundled-runtime.md）：
#   native — 5 个平台各带原生二进制 + libvips，约 83 MB，最快、大图内存最省
#   wasm   — 只带 WASM 版，约 46 MB；小图慢约 1.5 倍，48MP 大图内存约 480MB（原生 48MB）
#   hybrid — 仅 Windows 用原生，macOS/Linux 走 WASM，约 54 MB
# dsh.runtime.sharp=native

# 需要跳过内置（例如本地快速迭代、或排查运行时问题时）：
# dsh.runtime.skip=true

# 工具链位置，默认取 PATH 里的 node / npm
# dsh.runtime.node=node
# dsh.runtime.npm=npm
