name: 发布 dsh 运行时（热更新渠道）

# 这是插件「运行时热更新」的发布渠道。
#
# 动机：插件包里内置的 dsh 运行时是发布时那一刻的版本，dsh 迭代很快，用户想用新版
# 就得等插件发版。所以把运行时版本与插件版本解耦 —— 定时检查 npm 上有没有新的 dsh，
# 有就用**同一套** Gradle 任务（bundleDshRuntime）构建运行时包并挂到 Release 上，
# 插件侧据此热更新。
#
# 为什么不把「从 npm 解析依赖」搬到插件里做：dsh 的 72 个直接依赖里 69 个是一方包，
# 但全部用 `^x.y.z` 范围声明（还带 prerelease），要在 Java 里正确解析 semver 范围 +
# 递归依赖 + 平台过滤，等于重写半个 npm。而这条 Gradle 链路已经跑通并有两级自检，
# 复用它比重新实现一套可靠得多。
#
# 标签约定：runtime-<dshVersion>，例如 runtime-0.1.5-rc.1
# 资产（按平台拆分，插件只下自己那一份；整包压缩后 82.9 MB，拆开每平台约 41 MB，省 51%）：
#   dsh-runtime-<target>.zip      target ∈ win32-x64 / darwin-x64 / darwin-arm64 / linux-x64 / linux-arm64
#   runtime-meta-<target>.txt     对应的元数据（dshVersion / stamp / entries / unpackedBytes）

on:
  schedule:
    # 每天 UTC 20:00（北京时间次日 04:00）
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的 dsh 版本（留空 = npm 上的 latest）'
        required: false
        default: ''

permissions:
  contents: write

# 同一个 dsh 版本不并发构建：两个 run 同时 gh release create 同一个 tag，后一个必然失败。
concurrency:
  group: runtime-release
  cancel-in-progress: false

jobs:
  check:
    name: 查 npm 上有没有新版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      skip: ${{ steps.pick.outputs.skip }}
    env:
      # 这个 job 没有 actions/checkout，gh 无法从本地 git 仓库推断目标仓库，
      # 必须显式指定，否则 gh 会报 "not a git repository"。
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 选定版本并判断是否已发布
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          want="${WANT:-}"
          if [ -z "$want" ]; then
            want=$(curl -fsSL --retry 3 --retry-delay 5 \
              https://registry.npmjs.org/@deepseek-ai/dsh/latest | jq -r .version)
          fi
          if [ -z "$want" ] || [ "$want" = "null" ]; then
            echo "::error::没能确定 dsh 版本"
            exit 1
          fi
          echo "选定 dsh 版本：$want"
          if gh release view "runtime-$want" >/dev/null 2>&1; then
            echo "runtime-$want 已存在，本次跳过构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"

  build:
    name: 构建并发布运行时
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      # 仓库里的 distributionUrl 指向腾讯云镜像（为国内网络改的）。runner 在海外，
      # 这里改回官方源，免得 CI 依赖一个跟它不在同一区域的镜像。
      - name: Gradle 换回官方分发包源
        run: |
          set -euo pipefail
          VER=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-bin\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | tail -1)
          echo "Gradle 版本：$VER"
          sed -i "s#^distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${VER}-bin.zip#" \
            gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      # 构建脚本要求「构建机自己的平台必须在目标列表里」——只有它的二进制能在构建机上
      # 真正跑起来，后面的自检才有意义。ubuntu-latest 是 linux-x64，在目标列表内。
      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 需要两个 JDK：
      #   * 17 —— 项目显式钉死的工具链（java.toolchain.languageVersion=17）。本机是靠
      #     用户级 org.gradle.java.installations.paths 找到 D:\jdks\jdk-17.0.2 的，CI 上没有
      #     这份配置，settings.gradle.kts 也没配 toolchain resolver（无法自动下载），
      #     所以必须在这里真的装一个 17。setup-java 会同时导出 JAVA_HOME_17_X64，
      #     Gradle 的自动探测认得这个环境变量。
      #   * 21 —— 作为默认 JAVA_HOME 运行 Gradle 本身。
      - name: 装 JDK（17 供工具链，21 跑 Gradle）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: 构建运行时（全 5 平台 + 按平台拆包）
        run: |
          ./gradlew bundleDshRuntime \
            -Pdsh.runtime.version='${{ needs.check.outputs.version }}' \
            --console=plain --stacktrace

      - name: 列出产物
        run: ls -lh build/dsh-runtime/ build/dsh-runtime/split/

      - name: 生成发布说明
        env:
          VER: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<EOF
          内置 dsh 运行时 ${VER}（按平台拆分，供插件热更新使用）。

          由 bundleDshRuntime 构建，与插件内置基线走完全相同的裁剪与自检流程。

          各平台只下自己那一份：dsh-runtime-<target>.zip + runtime-meta-<target>.txt
          EOF

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "runtime-$VER" \
            --title "dsh 运行时 $VER" \
            --notes-file RELEASE_NOTES.md \
            build/dsh-runtime/split/*.zip build/dsh-runtime/split/*.txt
